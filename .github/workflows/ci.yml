# Build the must-gather container and check the collection scripts.
#
# Upstream's CI (.ci-operator.yaml, OWNERS, prow) does not run for this fork,
# so this is what stands in for it.
#
# The lint and test job runs inside a Fedora container on purpose:
# hack/tools-from-packages.sh gets bats, shellcheck and shfmt from the
# distribution rather than downloading release binaries from GitHub, and that
# needs dnf. It is the same path used locally, so CI and a laptop agree.
#
# The image is built on a base this repo produces from UBI9 minimal, which
# Red Hat rebuilds continuously and which needs no pull credentials. It used
# to layer onto quay.io/openshift/origin-must-gather:latest, last rebuilt in
# February; since this image adds nothing but shell scripts, all of that
# staleness showed up in a scan as though it were ours.
#
# For collecting from a cluster you have access to, prefer layering onto that
# cluster's own must-gather image instead -- see Dockerfile.overlay. It
# carries exactly the CVEs you have already accepted.

name: ci

on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PLATFORMS: linux/amd64
  IMAGE_NAME: better-gather
  # Built here from UBI9 rather than pulled: no public must-gather image has
  # been rebuilt recently enough to ship on.
  # Via a scratch registry on the runner, not a bare local tag: buildx's
  # docker-container driver has its own image store and cannot see what
  # `--load` put in the docker daemon, so `FROM better-gather-base:ci` in the
  # overlay would be resolved against Docker Hub and fail. A registry is also
  # what makes a multi-platform base usable by the overlay build.
  BASE_IMAGE: localhost:5000/better-gather-base:ci
  MAX_BASE_AGE_DAYS: "60"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install the bits the container lacks
        # git is needed by actions/checkout and by the test helper's
        # `git rev-parse --show-toplevel`; rpm/cpio by tools-from-packages;
        # numactl-libs because Fedora's shellcheck binary links against it and
        # unpacking an rpm does not pull its dependencies; jq because
        # trim_jsonl_since uses it and the must-gather images ship it.
        run: dnf -y install --setopt=install_weak_deps=False
          git make findutils tar gzip diffutils cpio rpm gawk numactl-libs jq

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bootstrap tooling from the distribution
        run: ./hack/tools-from-packages.sh

      - name: Lint and run the shell tests
        # bats-check rather than upstream's `test`: build-machinery-go
        # attaches test-unit to that and hard-requires a Go toolchain,
        # which has nothing to do with checking shell scripts. The version
        # check in the vendored golang.mk runs at parse time, so it fires for
        # any target; GO_REQUIRED_MIN_VERSION:= is its documented override.
        run: make GO_REQUIRED_MIN_VERSION:= bats-check

  scan-code:
    # Vulnerable dependencies, committed secrets and Dockerfile
    # misconfiguration, across the whole tree including the vendored Go.
    #
    # Reporting only, like the image scan: this job never fails the build.
    # Accepted findings live in .trivyignore, each with a reason -- today
    # that is DS-0002 alone, since a must-gather image cannot run as a
    # non-root user.
    #
    # `make scan-code` runs the same scan locally, with trivy from the
    # distribution rather than from this action.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tree
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: '**/vendor'
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0

      - name: Keep the code scan as an artifact
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: '**/vendor'
          format: json
          output: trivy-code.json
          exit-code: 0

      - name: Upload the code scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-code-${{ github.sha }}
          path: trivy-code.json
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      # Somewhere for the base image to live between the two builds below.
      # Thrown away with the runner; nothing is published from here.
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # So the builder container can reach the registry service on
          # localhost:5000. BuildKit treats localhost registries as plain
          # HTTP, so no certificate wrangling is needed.
          driver-opts: network=host

      - name: Build a current base from UBI9
        # No credentials needed, and rebuilt continuously upstream, unlike
        # every public must-gather image.
        #
        # Every platform, not just this runner's: the overlay's push step
        # needs a base manifest covering all of them.
        run: |
          docker buildx build \
            --platform "$PLATFORMS" \
            -f Dockerfile.base \
            -t "$BASE_IMAGE" \
            --push .

      - name: Refuse to ship on a stale base
        run: |
          ./hack/check-base.sh --max-age "$MAX_BASE_AGE_DAYS" \
            registry.access.redhat.com/ubi9/ubi-minimal:latest

      - name: Build for this runner and load it, so it can be tested
        # Multi-platform builds cannot be --load'ed into the local docker, so
        # the image that gets smoke-tested is the native one. The Dockerfile
        # is FROM + COPY only, so the other platforms differ solely in their
        # base layer -- nothing is compiled, and nothing needs emulating.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE="$BASE_IMAGE" \
            --build-arg BASE_BUILT="$(date -u +%Y-%m-%d)" \
            -f Dockerfile.overlay \
            -t "$IMAGE_NAME:ci" \
            --load .

      - name: The collection scripts parse inside the image
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE_NAME:ci" -c '
            set -eu
            n=0
            for f in /usr/bin/gather*; do
              [ -f "$f" ] || continue
              bash -n "$f" || { echo "FAILED to parse: $f" >&2; exit 1; }
              n=$((n + 1))
            done
            echo "parsed $n collection scripts"
            [ "$n" -gt 0 ]
          '

      - name: The --since library works inside the image
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE_NAME:ci" -c '
            set -eu
            test -f /usr/bin/since_common.sh
            # shellcheck source=/dev/null
            . /usr/bin/since_common.sh

            # durations collapse exactly, not by truncation
            [ "$(duration_to_node_logs_since 2h30m0s)" = "150m" ]
            [ "$(duration_to_node_logs_since 500ms)" = "1s" ]

            # The find predicate is checked by what it selects rather than by
            # how it is spelled, so that rewording it does not fail the build
            # and changing its behaviour does.
            cd "$(mktemp -d)"
            touch -d "2 hours ago" live.log rotated-2024-01-01.log rotated.log.gz
            touch recent.log

            MUST_GATHER_SINCE=30m0s get_since_cutoff
            [ -n "${since_cutoff_epoch}" ]
            got="$(eval "find . -type f $(since_find_predicate) -print" | sort | tr "\n" " ")"
            # live.log predates the cutoff but is the file still being written
            # to, so it holds the records covering the window. The rotated and
            # compressed ones are genuinely out of it.
            [ "$got" = "./live.log ./recent.log " ] || {
              echo "unexpected selection: [$got]" >&2; exit 1; }

            # and no window selects everything
            unset MUST_GATHER_SINCE
            get_since_cutoff
            [ -z "$(since_find_predicate)" ]
            [ "$(eval "find . -type f $(since_find_predicate) -print" | wc -l)" -eq 4 ]

            echo "in-image --since library OK"
          '

      - name: Scan the image for vulnerabilities
        # Reporting only: `exit-code: 0`. An unfixed CVE in the base is not
        # something this repo can action -- it adds no packages of its own --
        # and a gate nobody can satisfy only teaches people to ignore it. The
        # staleness gate above is what actually keeps the base current, which
        # is the part we control.
        #
        # Worth knowing what this does and does not see: the community base
        # this image used to be built on is CentOS Stream, which trivy has no
        # advisory feed for, so its OS packages were never assessed at all.
        # The UBI9 base reports as redhat 9.x and does get scanned.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0

      - name: Keep the image scan as an artifact
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          scanners: vuln
          format: json
          output: trivy-image.json
          exit-code: 0

      - name: Upload the image scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: warn

      - name: Work out the tags
        # main           -> :latest and :main-<sha>
        # release-4.18    -> :4.18 and :release-4.18
        # v* tag          -> :<tag> and :latest
        #
        # A release branch deliberately does not move :latest. Pointing
        # --image at :4.18 should get you the 4.18 collection scripts
        # whatever has happened on main since.
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME"
          REPO="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          REF_NAME="${GITHUB_REF#refs/heads/}"
          case "${GITHUB_REF}" in
          refs/tags/v*)
            TAGS="$REPO:${GITHUB_REF#refs/tags/},$REPO:latest"
            ;;
          refs/heads/release-*)
            TAGS="$REPO:${REF_NAME#release-},$REPO:${REF_NAME}"
            ;;
          *)
            TAGS="$REPO:latest,$REPO:main-${GITHUB_SHA::12}"
            ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "pushing: $TAGS"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build every platform and push
        # Pull requests build and test but never publish.
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --platform "$PLATFORMS" \
            --build-arg BASE="$BASE_IMAGE" \
            --build-arg BASE_BUILT="$(date -u +%Y-%m-%d)" \
            -f Dockerfile.overlay \
            $(echo "${{ steps.tags.outputs.tags }}" | tr "," "\n" | sed "s/^/--tag /" | tr "\n" " ") \
            --push .
